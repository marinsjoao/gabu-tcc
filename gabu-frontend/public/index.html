<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #000000;
        font-family: system-ui, sans-serif;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      #gabu-initial-loader {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: #ffffff;
      }

      #gabu-initial-loader .brand {
        margin: 0;
        font-size: 48px;
        font-weight: 900;
        letter-spacing: 8px;
      }

      #gabu-initial-loader .progress-track {
        width: 240px;
        height: 6px;
        margin-top: 28px;
        overflow: hidden;
        border-radius: 3px;
        background: #333333;
      }

      #gabu-initial-loader .progress-bar {
        width: 72px;
        height: 100%;
        border-radius: 3px;
        background: #7BAEFA;
        animation: gabu-progress 1.1s ease-in-out infinite;
      }

      #gabu-initial-loader .loading-text {
        margin: 14px 0 0;
        color: #b8c6dc;
        font-size: 14px;
      }

      @keyframes gabu-progress {
        from {
          transform: translateX(-72px);
        }
        to {
          transform: translateX(240px);
        }
      }
    </style>
  </head>
  <body>
    <noscript>Ative o JavaScript para usar o Gabu.</noscript>
    <div
      id="gabu-initial-loader"
      role="status"
      aria-label="Carregando o Gabu"
    >
      <p class="brand">GABU</p>
      <div class="progress-track" role="progressbar" aria-label="Carregando">
        <div class="progress-bar"></div>
      </div>
      <p class="loading-text">Carregando...</p>
    </div>
    <div id="root"></div>
  </body>
</html>
